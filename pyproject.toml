[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "TD", "UP", "I", "ICN", "COM", "FBT"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
skip-magic-trailing-comma = false
line-ending = "lf"
quote-style = "double"

[tool.black]
line-length = 120
target-version = ['py311']
preview = true
include = '\.pyi?$'
exclude = '''
/(
      .eggs
    | .git
    | .hg
    | .mypy_cache
    | .tox
    | venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
    | backend_env    # Fixed typo here
    | __pycache__
  )/
'''
